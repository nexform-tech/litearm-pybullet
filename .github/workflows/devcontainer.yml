# Build the dev container image and publish it to GitHub Container Registry.
# The published image is used as build cache by VS Code (see cacheFrom in
# .devcontainer/devcontainer.json), so "Reopen in Container" does not rebuild
# from scratch. Pull requests build without publishing, to validate the
# Dockerfile.
name: DevContainer

on:
  push:
    branches:
      - main
      - master
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer.yml"
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

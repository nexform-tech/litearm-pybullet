[metadata]
name = litearm-pybullet
version = 0.1.0
description = LiteArm 7-DOF PyBullet simulation, API-aligned with litearm-core
long_description = file: README.md
long_description_content_type = text/markdown
author = luochun
license = Proprietary
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12

[options]
python_requires = >=3.10
package_dir =
    = src
packages = find:
install_requires =
    pybullet>=3.2.5
    numpy>=1.21

[options.packages.find]
where = src

[options.package_data]
litearm_pybullet =
    assets/*.urdf
    assets/meshes/*.STL

[options.extras_require]
dev =
    pytest
    pytest-timeout
mirror =
    litearm-python